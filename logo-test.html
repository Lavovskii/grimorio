<!doctype html>
<html><head><meta charset="utf-8"><title>logo test</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800;900&family=Cinzel+Decorative:wght@700;900&family=Alegreya+Sans:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
body{background:#09081A;color:#fff;font-family:"Alegreya Sans",sans-serif;padding:24px;margin:0}
.row{display:flex;gap:28px;align-items:flex-end;margin-bottom:28px}
.light{background:#F4EFE4;padding:16px;border-radius:12px}
.bar{display:flex;align-items:center;gap:12px;background:rgba(9,8,26,.9);border:1px solid rgba(167,139,250,.2);padding:10px 16px;border-radius:12px;width:520px}
.bar img{width:46px;height:46px;filter:drop-shadow(0 0 10px rgba(139,92,246,.55))}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:"Cinzel",serif;font-weight:800;font-size:23px;letter-spacing:.06em;background:linear-gradient(180deg,#FFF3CF 0%,#F0D58C 45%,#C8973A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(0,0,0,.6))}
.wm b span{font-size:.78em}
.wm small{margin-top:4px;font-style:italic;font-size:13px;color:#BFB3E6;letter-spacing:.02em}
</style></head><body>
<div class="row"><img src="logo.svg" width="256"><img src="logo.svg" width="128"><img src="logo.svg" width="64"><img src="logo.svg" width="40"><img src="logo.svg" width="32"><img src="logo.svg" width="16"></div>
<div class="row light"><img src="logo.svg" width="128"><img src="logo.svg" width="40"><img src="logo.svg" width="16"></div>
<div class="row"><div class="bar"><img src="logo.svg" alt=""><div class="wm"><b>Tibia <span>&nbsp;</span>Grimoire</b><small>Everything about Tibia, in one place</small></div></div></div>
</body></html>
