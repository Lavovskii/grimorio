<script>
  /* r31: o Questski veste o tema Tibia do Grimório (css/style.css: as mesmas cores, letra, topo e menu; só tema escuro).
     O Modern "Neon Arcano" (css/modern.css) saiu na r28 por pesar nas placas gráficas antigas.
     html.fx-lite: a mesma escolha de efeitos do Grimório ("grimorio-fx", rodapé do Grimório) ou um PC fraco. */
  (function () {
    var d = document.documentElement, n = navigator, f = "";
    try { f = localStorage.getItem("grimorio-fx") || ""; } catch (e) {}
    if (f === "lite" || f === "auto-lite" || (f !== "full" && ((n.hardwareConcurrency && n.hardwareConcurrency <= 2) || (n.deviceMemory && n.deviceMemory <= 2) || (n.connection && n.connection.saveData)))) d.classList.add("fx-lite");
  })();
</script>
