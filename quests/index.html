<!doctype html>
<html lang="pt-PT" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tibia Questski</title>
<meta name="description" content="Guias passo-a-passo de todas as quests do Tibia do nível 1 ao 100, com mapas, coordenadas e capturas.">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/modern.css">
<link rel="stylesheet" href="../shared/sites.css">
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("tq-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script>
  /* visual Original / Modern, partilhado com o Grimório (localStorage "grimorio-ui"); o Modern usa css/modern.css */
  (function () {
    try {
      if (localStorage.getItem("grimorio-ui") === "modern") {
        document.documentElement.setAttribute("data-ui", "modern");
        var l = document.createElement("link");
        l.rel = "stylesheet"; l.id = "mdFonts";
        l.href = "https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Russo+One&display=swap";
        document.head.appendChild(l);
      }
    } catch (e) {}
  })();
</script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Lista de quests" title="Lista de quests"></button>
  <a class="brand" href="#/" aria-label="Tibia Questski — início">
    <img src="assets/logo-mark.webp" alt="" class="brand-logo" width="84" height="56">
    <span class="brand-text"><span class="brand-tibia">Tibia</span><span class="brand-quest">Questski</span></span>
  </a>
  <nav class="sitesw" aria-label="Mudar de site"><a href="../" id="swGrimorio" title="Hunts, builds, equipamento e wiki"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M5 16a4 4 0 0 1 4-4h11"/></svg><span>Grimório</span></a><a href="./" aria-current="page" title="Guias de quests passo a passo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h11a2 2 0 0 1 2 2v1H9M7 3a2 2 0 0 0-2 2v13a3 3 0 0 0 3 3h10a2 2 0 0 0 2-2v-1H10v1a2 2 0 0 1-4 0"/><path d="M9 8h7M9 12h7"/></svg><span>Questski</span></a></nav>
  <nav class="mainnav" id="mainnav">
    <a href="#/" data-nav="home">Início</a>
    <a href="#/quests" data-nav="quests">Quests</a>
    <a href="#/mapa" data-nav="mapa">Mapa</a>
    <a href="#/acessos" data-nav="acessos">Acessos</a>
    <a href="#/wiki" data-nav="wiki">Wiki</a>
    <a href="#/progresso" data-nav="progresso">Progresso</a>
  </nav>
  <label class="search">
    <span class="search-ico" aria-hidden="true"></span>
    <input id="search" type="search" placeholder="Procurar quest, item, NPC…" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
  </label>
  <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Mudar entre tema claro e escuro" title="Tema claro / escuro"></button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Lista de quests">
    <div class="sidebar-filters" id="sidebarFilters"></div>
    <div class="sidebar-list" id="questList"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main">
    <div class="tabstrip" id="tabstrip" role="tablist" aria-label="Quests abertas"></div>
    <div class="view" id="view"></div>
    <footer class="footer">
      <div class="ui-mode"><span id="uiModeLab">Visual</span><div class="ui-seg" role="group" aria-labelledby="uiModeLab">
        <button type="button" data-ui-set="original" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/></svg>Original</button>
        <button type="button" data-ui-set="modern" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>Modern</button>
      </div></div>
      <p>Tibia Questski · conteúdo baseado na TibiaWiki (tibia.fandom.com, CC BY-SA) · mapa de TibiaMaps (tibiamaps.io) · Tibia é uma marca da CipSoft GmbH. Projeto de fãs, sem afiliação.</p>
    </footer>
  </main>
</div>

<div class="modal" id="mapModal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="mapModalTitle">Mapa</h3>
      <div class="modal-actions" id="mapModalActions"></div>
      <button class="icon-btn modal-close" data-close aria-label="Fechar"></button>
    </div>
    <div class="map-host" id="mapModalHost"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden>
  <button class="icon-btn lb-close" data-close aria-label="Fechar"></button>
  <button class="lb-nav lb-prev" aria-label="Anterior">‹</button>
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button class="lb-nav lb-next" aria-label="Seguinte">›</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/ponte.js"></script>
<script src="js/ui-mode.js"></script>
<script src="js/app.js"></script>
</body>
</html>
